name: Feature request
description: Propose a focused improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach and alternatives
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety review
      options:
        - label: This proposal does not weaken approval, privacy, or no-auto-push policies.
