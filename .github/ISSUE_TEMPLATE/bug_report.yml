name: Bug report
description: Report a reproducible Yuntra defect
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, private project data, or security vulnerabilities. Use private reporting for vulnerabilities."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: "1. Run ...\n2. Observe ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Yuntra version or commit
  - type: input
    id: environment
    attributes:
      label: OS, Python version, and shell
